<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="市場情緒">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2F6FED">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232F6FED'/%3E%3Cstop offset='1' stop-color='%23134FCB'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='40' fill='url(%23g)'/%3E%3Cpath d='M20 100 L60 100 L72 70 L88 130 L100 60 L112 100 L160 100' fill='none' stroke='%23FFFFFF' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>市場情緒 · Sentiment Pulse</title>
<style>
  :root{
    --bg:#0B0E11;
    --surface:#12161C;
    --surface-2:#181D24;
    --line:#232830;
    --text:#E8EAED;
    --muted:#7C8494;
    --brand:#2F6FED;
    --brand-dim:rgba(47,111,237,0.14);
    --bull:#00D48A;
    --bull-dim:rgba(0,212,138,0.14);
    --bear:#FF4D5E;
    --bear-dim:rgba(255,77,94,0.14);
    --neutral:#FFB443;
    --neutral-dim:rgba(255,180,67,0.14);
    --mono:'SF Mono','SFMono-Regular','Menlo','Consolas',monospace;
    --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:var(--sans);
    height:100%;
    overscroll-behavior-y:contain;
  }
  body{
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .status-bar-fill{
    position:fixed;top:0;left:0;right:0;
    height:env(safe-area-inset-top);
    background:var(--brand);
    z-index:100;
  }
  .app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  /* ---- Header / Pulse ---- */
  header{padding:18px 18px 14px;border-bottom:1px solid var(--line);}
  .top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .brand{font-size:15px;letter-spacing:0.06em;color:var(--muted);font-family:var(--mono);text-transform:uppercase;}
  .top-actions{display:flex;align-items:center;gap:10px;}
  .clock{font-size:12px;font-family:var(--mono);color:var(--muted);}
  .icon-btn{
    width:30px;height:30px;border-radius:9px;background:var(--surface);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    color:var(--muted);cursor:pointer;font-size:15px;
  }
  .icon-btn:active{background:var(--surface-2);}

  .pulse-card{
    background:linear-gradient(180deg,var(--surface-2),var(--surface));
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 16px 10px;
    position:relative;
    overflow:hidden;
  }
  .pulse-label{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);}
  .pulse-score-row{display:flex;align-items:flex-end;gap:10px;margin-top:6px;}
  .pulse-score{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1;}
  .pulse-tag{font-size:13px;font-weight:600;padding:4px 10px;border-radius:100px;margin-bottom:6px;}
  #pulseCanvasWrap{margin-top:12px;height:46px;position:relative;}
  svg#pulseSvg{width:100%;height:100%;display:block;}
  .pulse-sub{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:6px;padding-bottom:4px;}

  /* ---- Tabs ---- */
  .tabs{display:flex;gap:8px;padding:14px 18px 4px;}
  .tab{
    flex:1;text-align:center;padding:9px 0;border-radius:10px;
    font-size:14px;font-weight:600;color:var(--muted);
    background:var(--surface);border:1px solid var(--line);
    cursor:pointer;user-select:none;transition:.15s ease;
  }
  .tab.active{color:#fff;background:var(--brand);border-color:var(--brand);}

  /* ---- Settings Sheet ---- */
  .sheet-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,0.55);
    display:none;align-items:flex-end;justify-content:center;z-index:200;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    width:100%;max-width:520px;background:var(--surface);
    border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:none;
    padding:16px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:82vh;overflow-y:auto;
  }
  .sheet h3{margin:4px 0 12px;font-size:16px;}
  .sheet-tabs{display:flex;gap:8px;margin-bottom:16px;}
  .sheet-tab{flex:1;text-align:center;padding:8px 0;border-radius:9px;font-size:13px;font-weight:600;
    background:var(--surface-2);color:var(--muted);border:1px solid var(--line);cursor:pointer;}
  .sheet-tab.active{background:var(--brand);color:#fff;border-color:var(--brand);}
  .sheet-panel{display:none;}
  .sheet-panel.active{display:block;}
  .field-label{font-size:12px;color:var(--muted);margin:12px 0 6px;font-family:var(--mono);}
  .field-input, .field-select, .field-textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
    color:var(--text);padding:10px 12px;font-size:14px;font-family:var(--sans);
  }
  .field-textarea{min-height:64px;resize:vertical;}
  .btn-primary{
    width:100%;margin-top:16px;padding:12px 0;border-radius:11px;border:none;
    background:var(--brand);color:#fff;font-size:15px;font-weight:700;cursor:pointer;
  }
  .swatch-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
  .swatch{
    width:38px;height:38px;border-radius:50%;border:2px solid transparent;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .swatch.selected{border-color:#fff;}
  .my-ticker-row{display:flex;align-items:center;justify-content:space-between;
    background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;margin-top:8px;font-size:13px;}
  .remove-x{color:var(--bear);font-size:13px;cursor:pointer;padding:2px 8px;}

  /* ---- Feed ---- */
  .feed{flex:1;padding:6px 14px 100px;}
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 14px 12px;
    margin:10px 4px;
    position:relative;
  }
  .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .ticker-pill{
    font-family:var(--mono);font-size:11.5px;font-weight:700;
    color:var(--bg);background:var(--text);
    padding:2px 8px;border-radius:6px;letter-spacing:.02em;
  }
  .market-flag{font-size:11px;color:var(--muted);font-family:var(--mono);margin-left:8px;}
  .sent-badge{
    display:flex;align-items:center;gap:5px;
    font-size:12px;font-weight:700;padding:3px 9px;border-radius:100px;
  }
  .dot{width:6px;height:6px;border-radius:50%;}
  .headline{font-size:15.5px;line-height:1.45;margin:2px 0 8px;color:var(--text);}
  .card-bottom{display:flex;justify-content:space-between;align-items:center;}
  .source{font-size:11.5px;color:var(--muted);}
  .conf{font-size:11px;color:var(--muted);font-family:var(--mono);}

  .bull{color:var(--bull);background:var(--bull-dim);}
  .bear{color:var(--bear);background:var(--bear-dim);}
  .neu{color:var(--neutral);background:var(--neutral-dim);}
  .dot.bull{background:var(--bull);}
  .dot.bear{background:var(--bear);}
  .dot.neu{background:var(--neutral);}

  footer{
    position:fixed;bottom:0;left:0;right:0;
    max-width:520px;margin:0 auto;
    padding:10px 18px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,var(--bg) 60%,transparent);
    text-align:center;font-size:10.5px;color:var(--muted);font-family:var(--mono);
    pointer-events:none;
  }
</style>
</head>
<body>
<div class="status-bar-fill"></div>
<div class="app">
  <header>
    <div class="top-row">
      <span class="brand">市場情緒 · Sentiment Pulse</span>
      <div class="top-actions">
        <span class="clock" id="clock">--:--</span>
        <div class="icon-btn" id="settingsBtn">⚙</div>
      </div>
    </div>
    <div class="pulse-card">
      <div class="pulse-label">綜合情緒指數 · 港股 + 美股</div>
      <div class="pulse-score-row">
        <div class="pulse-score" id="pulseScore">--</div>
        <div class="pulse-tag" id="pulseTag">計算中</div>
      </div>
      <div id="pulseCanvasWrap"><svg id="pulseSvg" viewBox="0 0 300 46" preserveAspectRatio="none"></svg></div>
      <div class="pulse-sub"><span id="bullCount">利多 --</span><span id="neuCount">中性 --</span><span id="bearCount">利空 --</span></div>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-f="all">全部</div>
    <div class="tab" data-f="hk">港股</div>
    <div class="tab" data-f="us">美股</div>
  </div>

  <div class="feed" id="feed"></div>

  <footer>來源標示於各卡片 · 情緒判讀為關鍵字模型，僅供參考，非投資建議</footer>
</div>

<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <h3>設定</h3>
    <div class="sheet-tabs">
      <div class="sheet-tab active" data-p="addTicker">新增股票</div>
      <div class="sheet-tab" data-p="theme">主題色</div>
    </div>

    <div class="sheet-panel active" id="panel-addTicker">
      <div class="field-label">股票代碼</div>
      <input class="field-input" id="inTicker" placeholder="例如 0700.HK 或 NVDA">
      <div class="field-label">市場</div>
      <select class="field-select" id="inMarket">
        <option value="hk">港股</option>
        <option value="us">美股</option>
      </select>
      <div class="field-label">新聞內容（貼上標題或重點）</div>
      <textarea class="field-textarea" id="inText" placeholder="例如：公司季度業績優於預期，股價大漲"></textarea>
      <div class="field-label">來源（選填）</div>
      <input class="field-input" id="inSrc" placeholder="例如 自訂 / 鉅亨網">
      <button class="btn-primary" id="addTickerBtn">加入新聞卡</button>
      <div id="myTickerList"></div>
    </div>

    <div class="sheet-panel" id="panel-theme">
      <div class="field-label">選擇主題色</div>
      <div class="swatch-row" id="swatchRow"></div>
    </div>
  </div>
</div>

<script>
const THEMES = {
  blue:{name:'藍', hex:'#2F6FED', hex2:'#134FCB'},
  green:{name:'綠', hex:'#00B87C', hex2:'#007A52'},
  purple:{name:'紫', hex:'#8B5CF6', hex2:'#5B3AC4'},
  amber:{name:'金', hex:'#F5A524', hex2:'#B87400'},
  rose:{name:'玫瑰', hex:'#F43F6E', hex2:'#B4204A'},
};

function applyTheme(key){
  const t = THEMES[key] || THEMES.blue;
  document.documentElement.style.setProperty('--brand', t.hex);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', t.hex);
  const icon = document.querySelector('link[rel="apple-touch-icon"]');
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='${t.hex}'/><stop offset='1' stop-color='${t.hex2}'/></linearGradient></defs><rect width='180' height='180' rx='40' fill='url(%23g)'/><path d='M20 100 L60 100 L72 70 L88 130 L100 60 L112 100 L160 100' fill='none' stroke='%23FFFFFF' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/></svg>`;
  icon.setAttribute('href', 'data:image/svg+xml,' + encodeURIComponent(svg).replace(/'/g,'%27'));
  localStorage.setItem('sp_theme', key);
  renderSwatches(key);
}

function renderSwatches(active){
  const row = document.getElementById('swatchRow');
  row.innerHTML = '';
  Object.keys(THEMES).forEach(key=>{
    const t = THEMES[key];
    const el = document.createElement('div');
    el.className = 'swatch' + (key===active ? ' selected' : '');
    el.style.background = t.hex;
    el.title = t.name;
    el.addEventListener('click', ()=>applyTheme(key));
    row.appendChild(el);
  });
}

// ---- Settings sheet open/close ----
const backdrop = document.getElementById('sheetBackdrop');
document.getElementById('settingsBtn').addEventListener('click', ()=>backdrop.classList.add('open'));
backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) backdrop.classList.remove('open'); });

document.querySelectorAll('.sheet-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.sheet-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.sheet-panel').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.p).classList.add('active');
  });
});

// ---- My tickers (localStorage) ----
function loadMyTickers(){
  try{ return JSON.parse(localStorage.getItem('sp_my_tickers') || '[]'); }
  catch(e){ return []; }
}
function saveMyTickers(list){ localStorage.setItem('sp_my_tickers', JSON.stringify(list)); }

function renderMyTickerList(){
  const list = loadMyTickers();
  const wrap = document.getElementById('myTickerList');
  wrap.innerHTML = list.length ? '<div class="field-label" style="margin-top:16px;">已加入的自訂新聞</div>' : '';
  list.forEach((item, idx)=>{
    const row = document.createElement('div');
    row.className = 'my-ticker-row';
    row.innerHTML = `<span>${item.ticker} · ${item.text.slice(0,16)}...</span><span class="remove-x" data-idx="${idx}">移除</span>`;
    wrap.appendChild(row);
  });
  wrap.querySelectorAll('.remove-x').forEach(x=>{
    x.addEventListener('click', ()=>{
      const list = loadMyTickers();
      list.splice(parseInt(x.dataset.idx), 1);
      saveMyTickers(list);
      rebuildFeedWithCustom();
      renderMyTickerList();
    });
  });
}

document.getElementById('addTickerBtn').addEventListener('click', ()=>{
  const ticker = document.getElementById('inTicker').value.trim();
  const market = document.getElementById('inMarket').value;
  const text = document.getElementById('inText').value.trim();
  const src = document.getElementById('inSrc').value.trim() || '自訂';
  if(!ticker || !text){ alert('請填寫股票代碼和新聞內容'); return; }
  const list = loadMyTickers();
  list.unshift({ticker, market, text, src});
  saveMyTickers(list);
  document.getElementById('inTicker').value = '';
  document.getElementById('inText').value = '';
  document.getElementById('inSrc').value = '';
  rebuildFeedWithCustom();
  renderMyTickerList();
});

function rebuildFeedWithCustom(){
  const custom = loadMyTickers();
  const combined = [...custom, ...NEWS];
  window.__ITEMS = buildItems(combined);
  render();
  updatePulse();
}

// init on load
renderMyTickerList();
applyTheme(localStorage.getItem('sp_theme') || 'blue');
rebuildFeedWithCustom();
</script>

</body>

<script>
// ---- Seed data (paraphrased headlines, HK + US) ----
const NEWS = [
  {ticker:"0981.HK", market:"hk", src:"Yahoo奇摩股市", text:"中芯國際單日股價大漲逾10%，成交量顯著放大，收復近期部分跌幅"},
  {ticker:"0981.HK", market:"hk", src:"格隆匯", text:"國產芯片巨頭業績周將至，市場關注中芯國際等半導體龍頭本季財報表現"},
  {ticker:"AMAT", market:"us", src:"經濟日報", text:"應用材料上季財報與財測優於華爾街預期並調升全年營收展望，但股價盤前仍重挫逾5%，反映市場期待更高"},
  {ticker:"0001.HK", market:"hk", src:"香港01", text:"長和中期純利大增近三十倍，負債比率降至歷史新低，管理層強調嚴格控管成本"},
  {ticker:"MU", market:"us", src:"鉅亨網", text:"美光股價逼近千美元關口，多家華爾街機構上調目標價，記憶體漲價週期持續發酵"},
  {ticker:"SNDK", market:"us", src:"鉅亨網", text:"SanDisk 兩週內股價反彈逾六成，投資人日公布的財測與技術藍圖帶動樂觀情緒"},
  {ticker:"US-TECH", market:"us", src:"鉅亨網", text:"四大科技巨頭財報季將至，加上聯準會利率決議登場，市場預期短線恐迎劇烈波動"},
  {ticker:"SPCX", market:"us", src:"Investing.com", text:"摩根士丹利點名多項催化劑，看好SpaceX年底前股價表現，AI與星艦進展是關鍵"},
  {ticker:"ORCL", market:"us", src:"Investing.com", text:"甲骨文AI數據中心關鍵天然氣管道延期近半年，市場憂心雲端擴張進度受拖累"},
  {ticker:"AAPL", market:"us", src:"Investing.com", text:"傳美國向蘋果施壓，要求避免採購中國製記憶體晶片，供應鏈布局添增不確定性"},
  {ticker:"VIX", market:"us", src:"AAStocks", text:"VIX恐慌指數處於低位，專家警告市場過度樂觀，平靜過後恐迎更猛烈賣壓"},
  {ticker:"US-RETAIL", market:"us", src:"經濟日報", text:"美國七月零售銷售數據意外低於市場預期，消費動能露出降溫跡象"},
];

// ---- Lightweight keyword sentiment model ----
const BULL_KW = ["優於預期","上調","調升","大增","新低","反彈","看好","樂觀","漲價","上漲","催化劑","強勁","突破"];
const BEAR_KW = ["重挫","延期","施壓","不確定","警告","跌勢","降溫","低於預期","拖累","恐迎","劇烈波動","賣壓","憂心"];

function scoreText(t){
  let s = 0;
  BULL_KW.forEach(k=>{ if(t.includes(k)) s += 1; });
  BEAR_KW.forEach(k=>{ if(t.includes(k)) s -= 1; });
  return s;
}

function classify(s){
  if(s >= 1) return {label:"bull", text:"利多"};
  if(s <= -1) return {label:"bear", text:"利空"};
  return {label:"neu", text:"中性"};
}

const items = NEWS.map(n=>{
  const raw = scoreText(n.text);
  const cls = classify(raw);
  const conf = Math.min(95, 55 + Math.abs(raw)*14);
  return {...n, raw, cls: cls.label, clsText: cls.text, conf};
});

function buildItems(list){
  return list.map(n=>{
    const raw = scoreText(n.text);
    const cls = classify(raw);
    const conf = Math.min(95, 55 + Math.abs(raw)*14);
    return {...n, raw, cls: cls.label, clsText: cls.text, conf};
  });
}
window.__ITEMS = items;

// ---- Render feed ----
const feed = document.getElementById('feed');
let currentFilter = 'all';

function marketFlag(m){ return m === 'hk' ? '🇭🇰 港股' : '🇺🇸 美股'; }

function render(){
  feed.innerHTML = '';
  const list = window.__ITEMS.filter(i => currentFilter === 'all' || i.market === currentFilter);
  list.forEach(i=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <div><span class="ticker-pill">${i.ticker}</span><span class="market-flag">${marketFlag(i.market)}</span></div>
        <div class="sent-badge ${i.cls}"><span class="dot ${i.cls}"></span>${i.clsText}</div>
      </div>
      <div class="headline">${i.text}</div>
      <div class="card-bottom">
        <span class="source">${i.src}</span>
        <span class="conf">信心度 ${i.conf}%</span>
      </div>
    `;
    feed.appendChild(card);
  });
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.f;
    render();
    updatePulse();
  });
});

// ---- Aggregate pulse ----
function updatePulse(){
  const list = window.__ITEMS.filter(i => currentFilter === 'all' || i.market === currentFilter);
  const bulls = list.filter(i=>i.cls==='bull').length;
  const bears = list.filter(i=>i.cls==='bear').length;
  const neus = list.filter(i=>i.cls==='neu').length;
  const total = list.length || 1;
  const score = Math.round(((bulls - bears) / total) * 100);

  document.getElementById('pulseScore').textContent = (score>0?'+':'') + score;
  document.getElementById('bullCount').textContent = '利多 ' + bulls;
  document.getElementById('neuCount').textContent = '中性 ' + neus;
  document.getElementById('bearCount').textContent = '利空 ' + bears;

  const tag = document.getElementById('pulseTag');
  const scoreEl = document.getElementById('pulseScore');
  let mood, cls;
  if(score >= 20){ mood='偏多'; cls='bull'; }
  else if(score <= -20){ mood='偏空'; cls='bear'; }
  else { mood='中性'; cls='neu'; }
  tag.textContent = mood;
  tag.className = 'pulse-tag ' + cls;
  scoreEl.style.color = cls==='bull' ? 'var(--bull)' : cls==='bear' ? 'var(--bear)' : 'var(--neutral)';

  drawPulseLine(list, cls);
}

function drawPulseLine(list, cls){
  const svg = document.getElementById('pulseSvg');
  const w = 300, h = 46, mid = h/2;
  const color = cls==='bull' ? '#00D48A' : cls==='bear' ? '#FF4D5E' : '#FFB443';
  let d = `M 0 ${mid}`;
  const n = Math.max(list.length, 6);
  const step = w / n;
  list.forEach((it, idx)=>{
    const x = idx*step + step*0.4;
    const amp = it.cls==='bull' ? -14 : it.cls==='bear' ? 14 : 4*(idx%2===0?1:-1);
    d += ` L ${x.toFixed(1)} ${mid} L ${(x+step*0.18).toFixed(1)} ${(mid+amp).toFixed(1)} L ${(x+step*0.36).toFixed(1)} ${mid}`;
  });
  d += ` L ${w} ${mid}`;
  svg.innerHTML = `<path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>`;
}

// ---- Clock ----
function tickClock(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = `${hh}:${mm}`;
}
tickClock();
setInterval(tickClock, 15000);

render();
updatePulse();
</script>
</body>
